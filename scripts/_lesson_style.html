<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #242736; --border: #2e3248;
    --accent: #6c8fff; --accent2: #a78bfa;
    --green: #34d399; --yellow: #fbbf24; --red: #f87171;
    --text: #e2e8f0; --muted: #94a3b8; --code-bg: #0d1117;
  }
  * { box-sizing: border-box; }
  body {
    max-width: 860px; margin: 0 auto; padding: 48px 24px 80px;
    background: var(--bg); color: var(--text); line-height: 1.7; font-size: 16px;
    font-family: -apple-system, 'Segoe UI', 'Noto Sans TC', sans-serif;
  }
  h1 { font-size: 1.9em; margin: 12px 0 6px; color: var(--text); line-height: 1.25; }
  h2 { color: var(--accent); font-size: 1.35em; margin: 44px 0 14px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  h3 { color: var(--accent2); font-size: 1.08em; margin: 26px 0 8px; }
  p { margin: 12px 0; }
  a { color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 1.05em; margin: 0 0 8px; }
  .pill {
    display: inline-block; background: var(--surface2); color: var(--accent2);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 14px;
    font-size: 0.8em; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600;
  }

  /* Callouts */
  .callout {
    border-left: 4px solid var(--accent); background: var(--surface);
    border-radius: 6px; padding: 14px 18px; margin: 20px 0;
  }
  .callout .label {
    display: block; font-size: 0.75em; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; margin-bottom: 6px;
  }
  .callout.insight { border-left-color: var(--accent); }
  .callout.insight .label { color: var(--accent); }
  .callout.matters { border-left-color: var(--green); }
  .callout.matters .label { color: var(--green); }
  .callout.warning { border-left-color: var(--yellow); }
  .callout.warning .label { color: var(--yellow); }
  .callout.pitfall { border-left-color: var(--red); }
  .callout.pitfall .label { color: var(--red); }
  .callout p { margin: 4px 0; }

  /* AI stack tour flow diagram */
  .tour-scroll { overflow-x: auto; margin: 24px 0 8px; padding-bottom: 6px; }
  .tour-flow { display: flex; align-items: stretch; gap: 0; min-width: 720px; }
  .tour-stage {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; min-width: 150px; flex: 1;
  }
  .tour-stage .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%; background: var(--accent);
    color: #0f1117; font-size: 0.75em; font-weight: 700; margin-bottom: 8px;
  }
  .tour-stage .name { font-weight: 700; color: var(--text); margin-bottom: 4px; font-size: 0.95em; }
  .tour-stage .desc { color: var(--muted); font-size: 0.82em; }
  .tour-arrow {
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 1.3em; padding: 0 6px; flex: 0 0 auto;
  }

  /* Stop sections */
  .stop {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px; margin: 16px 0;
  }
  .stop .q { color: var(--yellow); font-weight: 600; font-size: 0.95em; margin: 0 0 8px; }
  .stop .tag {
    display: inline-block; font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--accent2); border: 1px solid var(--border); border-radius: 5px;
    padding: 2px 8px; margin-bottom: 10px;
  }

  /* Roadmap timeline */
  .roadmap { margin: 20px 0; }
  .roadmap-item {
    display: grid; grid-template-columns: 46px 1fr; gap: 14px;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .roadmap-item:last-child { border-bottom: none; }
  .roadmap-num {
    width: 34px; height: 34px; border-radius: 50%; background: var(--surface2);
    border: 1px solid var(--border); color: var(--muted);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9em;
  }
  .roadmap-item.current .roadmap-num {
    background: var(--accent); color: #0f1117; border-color: var(--accent);
  }
  .roadmap-title { font-weight: 600; color: var(--text); font-size: 0.98em; }
  .roadmap-item.current .roadmap-title { color: var(--accent); }
  .roadmap-desc { color: var(--muted); font-size: 0.85em; margin-top: 2px; }
  @media (max-width: 600px) {
    .roadmap-item { grid-template-columns: 1fr; }
    .roadmap-num { margin-bottom: 4px; }
  }

  /* Quiz */
  .quiz {
    margin-top: 40px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px 22px;
  }
  .quiz h3 { color: var(--text); margin-top: 0; }
  .quiz-q { font-weight: 600; margin: 22px 0 8px; }
  .quiz-q:first-of-type { margin-top: 8px; }
  .quiz-opt {
    cursor: pointer; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; margin: 6px 0; transition: background .15s;
  }
  .quiz-opt:hover { background: var(--surface2); }
  .quiz-opt.correct { background: rgba(52,211,153,.15); border-color: var(--green); pointer-events: none; cursor: default; }
  .quiz-opt.wrong { background: rgba(248,113,113,.12); border-color: var(--red); }
  .quiz-feedback { min-height: 1.4em; margin-top: 6px; font-size: .9em; }
  .quiz-feedback.correct { color: var(--green); }
  .quiz-feedback.wrong { color: var(--red); }

  footer {
    margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 0.88em;
  }
  footer a { color: var(--accent2); }
  footer .teacher-note { margin-top: 12px; }

  /* Diagrams */
  figure.diagram {
    margin: 26px 0; padding: 20px 16px 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; text-align: center;
    overflow-x: auto;
  }
  figure.diagram svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
  figure.diagram figcaption {
    color: var(--muted); font-size: 0.85em; margin-top: 12px;
    text-align: left; line-height: 1.55;
  }
  .d-box { fill: var(--surface2); stroke: var(--border); stroke-width: 1.5; }
  .d-box-accent { fill: var(--surface2); stroke: var(--accent); stroke-width: 2; }
  .d-box-warn { fill: var(--surface2); stroke: var(--red); stroke-width: 2; }
  .d-box-good { fill: var(--surface2); stroke: var(--green); stroke-width: 2; }
  .d-label { fill: var(--text); font-size: 13px; font-family: -apple-system, sans-serif; }
  .d-label-sm { fill: var(--muted); font-size: 11px; font-family: -apple-system, sans-serif; }
  .d-label-b { fill: var(--text); font-size: 13px; font-weight: 600; font-family: -apple-system, sans-serif; }
  .d-accent { fill: var(--accent); font-size: 12px; font-weight: 600; font-family: -apple-system, sans-serif; }
  .d-arrow { stroke: var(--muted); stroke-width: 1.6; fill: none; }
  .d-arrow-accent { stroke: var(--accent); stroke-width: 2; fill: none; }
  .d-fill-accent { fill: var(--accent); }
  .d-fill-green { fill: var(--green); }
  .d-fill-red { fill: var(--red); }
  .d-fill-yellow { fill: var(--yellow); }
  .d-fill-muted { fill: var(--muted); }

  /* Further reading */
  .further { margin: 36px 0 8px; padding: 18px 20px; background: var(--surface);
             border: 1px solid var(--border); border-radius: 8px; }
  .further h3 { margin: 0 0 10px; color: var(--accent2); font-size: 1em; }
  ul.links { list-style: none; padding: 0; margin: 0; }
  ul.links li { margin: 0 0 10px; padding-left: 16px; position: relative; line-height: 1.5; }
  ul.links li::before { content: "\2197"; position: absolute; left: 0; color: var(--muted); font-size: 0.9em; }
  ul.links a { font-weight: 600; }
  .link-note { display: block; color: var(--muted); font-size: 0.86em; }

  /* Word-labelled variant of .roadmap — labels are terms, not step numbers */
  .roadmap.terms .roadmap-item { grid-template-columns: 150px 1fr; align-items: start; }
  .roadmap.terms .roadmap-num {
    width: auto; height: auto; min-height: 0; border-radius: 6px; padding: 4px 10px;
    background: var(--surface2); color: var(--accent2); font-size: 0.82em;
    font-weight: 700; justify-content: flex-start; text-align: left; line-height: 1.35;
    white-space: normal; word-break: break-word;
  }
  @media (max-width: 600px) {
    .roadmap.terms .roadmap-item { grid-template-columns: 1fr; }
    .roadmap.terms .roadmap-num { display: inline-block; margin-bottom: 6px; }
  }

  .further.shelf { border-left: 3px solid var(--accent2); }
  ul.books { list-style: none; padding: 0; margin: 0; }
  ul.books li { margin: 0 0 12px; padding-left: 18px; position: relative; line-height: 1.5; }
  ul.books li::before { content: "\1F4D5"; position: absolute; left: 0; font-size: 0.85em; }
  .bk-t { display: block; font-weight: 600; color: var(--text); }
  .bk-a { display: block; color: var(--accent2); font-size: 0.84em; }
  .bk-n { display: block; color: var(--muted); font-size: 0.86em; margin-top: 2px; }

  /* Things to know — compressed, quotable, harvested into the revision sheet */
  blockquote.know {
    margin: 28px 0; padding: 20px 24px 20px 26px;
    background: linear-gradient(90deg, var(--surface2), var(--surface));
    border-left: 4px solid var(--accent2); border-radius: 8px;
    font-size: 1.06em; line-height: 1.6; color: var(--text);
  }
  blockquote.know .know-label {
    display: block; font-size: 0.68em; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent2); margin-bottom: 8px;
  }
  blockquote.know strong { color: var(--accent2); }
  .know-rule { margin: 0 0 10px; font-size: 1.04em; font-weight: 600; color: var(--text); }
  .know-why { margin: 0 0 12px; font-size: 0.95em; color: var(--text); opacity: 0.92; }
  .know-eg {
    margin: 0; padding: 12px 14px; background: var(--code-bg); border-radius: 6px;
    font-size: 0.92em; color: var(--muted); line-height: 1.55;
  }
  .know-eg-label {
    display: block; font-size: 0.72em; font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--green); margin-bottom: 5px;
  }
</style>
