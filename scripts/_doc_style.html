<style>
  :root {
    --bg: #ffffff; --surface: #f3f5fa; --surface2: #e8ecf5; --border: #cfd6e6;
    --accent: #2f4fd0; --accent2: #5b37c4; --green: #0d7a55; --red: #b42318;
    --text: #1a1f2e; --muted: #4f5a70; --code-bg: #eef1f8; --field: #ffffff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #242736; --border: #2e3248;
      --accent: #8aa4ff; --accent2: #b9a2fb; --green: #34d399; --red: #f87171;
      --text: #e2e8f0; --muted: #a3afc2; --code-bg: #0d1117; --field: #12141c;
    }
  }
  * { box-sizing: border-box; }
  body { max-width: 860px; margin: 0 auto; padding: 24px 24px 80px; background: var(--bg); color: var(--text);
         line-height: 1.7; font-size: 16px; font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; }
  a { color: var(--accent); }
  h1 { font-size: 1.9em; line-height: 1.25; margin: 20px 0 8px; }
  h2 { color: var(--accent); font-size: 1.35em; margin: 40px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  h3 { color: var(--accent2); font-size: 1.1em; margin: 28px 0 8px; }
  h4 { font-size: 1em; margin: 20px 0 6px; }
  p { margin: 12px 0; }
  code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 0.92em; }
  pre { background: var(--code-bg); padding: 14px 16px; border-radius: 8px; overflow-x: auto; line-height: 1.5; }
  pre code { background: none; padding: 0; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 28px 0; }
  .skip { position: absolute; left: -999px; top: 8px; background: var(--accent); color: #fff; padding: 8px 14px; border-radius: 6px; z-index: 10; }
  .skip:focus { left: 8px; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .top { padding: 4px 0 8px; font-size: 0.92em; color: var(--muted); }
  .top a { color: var(--muted); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
  .btn { font: inherit; font-size: 0.9em; font-weight: 600; text-decoration: none; cursor: pointer; color: var(--text);
         background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; line-height: 1.2; }
  .btn:hover { background: var(--surface2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.quiet { background: transparent; }
  .btn.small { font-size: 0.82em; padding: 6px 10px; }
  .note { color: var(--muted); font-size: 0.92em; margin: 6px 0 18px; }
  .lead { color: var(--muted); font-size: 1.05em; }
  .toc { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 6px 18px 12px; margin: 20px 0; }
  .toc h2 { border: 0; margin: 10px 0 4px; font-size: 1em; color: var(--muted); }
  .toc ol { margin: 0; padding-left: 20px; columns: 2; column-gap: 28px; }
  .toc li { break-inside: avoid; }
  ul, ol { padding-left: 24px; }
  li { margin: 4px 0; }
  ul.tasks { list-style: none; padding-left: 0; }
  li.task label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
  li.task label:hover { background: var(--surface); }
  li.task input { width: 20px; height: 20px; margin-top: 4px; flex: none; accent-color: var(--accent); }
  li.task input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--border); }
  blockquote { margin: 16px 0; padding: 8px 18px; border-left: 4px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; }
  blockquote p { margin: 6px 0; }
  .fill { display: flex; gap: 10px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .fill > span { font-weight: 600; min-width: 5.5em; }
  input[type=text], textarea { font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; }
  .fill input[type=text] { flex: 1 1 260px; }
  textarea { width: 100%; min-height: 5.5em; resize: vertical; line-height: 1.5; }
  td input[type=text] { width: 100%; min-width: 7em; }
  .answer label { display: block; font-weight: 600; margin: 14px 0 6px; }
  .answer textarea { font-weight: 400; }
  details.key { border: 1px solid var(--border); border-radius: 8px; padding: 4px 16px; margin: 12px 0; background: var(--surface); }
  details.key summary { cursor: pointer; font-weight: 600; padding: 8px 0; }
  .table-scroll { overflow-x: auto; margin: 16px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 0.95em; }
  th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--surface2); }
  .table-actions { margin: -8px 0 16px; }
  ul.cards { list-style: none; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  ul.cards li { display: flex; flex-direction: column; gap: 4px; margin: 0; }
  a.card { display: block; flex: 1; text-decoration: none; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; }
  a.card:hover { background: var(--surface2); }
  a.card h3 { margin: 0 0 4px; font-size: 1em; color: var(--accent); }
  a.card p { margin: 0; color: var(--muted); font-size: 0.9em; line-height: 1.5; }
  a.mdlink { font-size: 0.82em; padding-left: 4px; }
  .foot { margin-top: 56px; color: var(--muted); font-size: 0.88em; }
  @media (max-width: 600px) { body { padding: 16px 16px 64px; } .toc ol { columns: 1; } }
  @media print {
    .toolbar, .skip, .top, .table-actions, .note { display: none !important; }
    body { max-width: none; padding: 0; background: #fff; color: #000; }
    a { color: #000; }
    input[type=text], textarea { border: 1px solid #888; background: #fff; color: #000; }
    details.key:not([open]) { display: none; }
    h2, h3 { break-after: avoid; } table, tr, li { break-inside: avoid; }
  }
</style>
