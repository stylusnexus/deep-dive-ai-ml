<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #242736; --border: #2e3248;
    --accent: #34d399; --accent2: #6c8fff;
    --text: #e2e8f0; --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    max-width: 860px; margin: 0 auto; padding: 48px 24px 80px;
    background: var(--bg); color: var(--text); line-height: 1.7; font-size: 16px;
    font-family: -apple-system, 'Segoe UI', 'Noto Sans TC', sans-serif;
  }
  .eyebrow { color: var(--muted); font-size: 0.85em; letter-spacing: 0.08em; text-transform: uppercase; }
  h1 { font-size: 2.1em; margin: 10px 0 8px; line-height: 1.2; }
  .lede { color: var(--muted); font-size: 1.08em; margin: 0 0 32px; }
  .meta { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 40px; }
  .chip {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 14px; font-size: 0.82em; color: var(--muted);
  }
  ol.lessons { list-style: none; counter-reset: lsn; padding: 0; margin: 0; }
  ol.lessons li { counter-increment: lsn; margin-bottom: 12px; }
  a.card {
    display: block; text-decoration: none; color: inherit; position: relative;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 22px 18px 68px; transition: border-color .15s, background .15s, transform .15s;
  }
  a.card:hover { border-color: var(--accent); background: var(--surface2); transform: translateY(-1px); }
  a.card::before {
    content: counter(lsn); position: absolute; left: 20px; top: 18px;
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--accent); font-weight: 700; font-size: 0.95em;
    display: flex; align-items: center; justify-content: center;
  }
  a.card:hover::before { border-color: var(--accent); }
  .card h2 { font-size: 1.05em; margin: 0 0 4px; line-height: 1.35; color: var(--text); }
  .card p { margin: 0; color: var(--muted); font-size: 0.92em; line-height: 1.55; }
  .aside {
    margin-top: 44px; background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--accent2); border-radius: 8px; padding: 18px 22px;
  }
  .aside h3 { margin: 0 0 8px; font-size: 0.95em; }
  .aside p { margin: 0 0 10px; color: var(--muted); font-size: 0.92em; }
  .aside p:last-child { margin-bottom: 0; }
  .aside a { color: var(--accent2); }
  footer { margin-top: 40px; color: var(--muted); font-size: 0.85em; border-top: 1px solid var(--border); padding-top: 20px; }
  @media (max-width: 480px) {
    body { padding: 32px 16px 60px; }
    h1 { font-size: 1.7em; }
    a.card { padding: 16px 16px 16px 60px; }
    a.card::before { left: 14px; }
  }
</style>
