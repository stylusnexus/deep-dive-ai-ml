# Render blueprint for the Project 4 assistant API (free plan).
# Free web services spin down after ~15 minutes idle; the first request after
# that waits roughly a minute for a cold start. The lessons site on GitHub
# Pages is static and unaffected.
services:
  - type: web
    name: aiml-course-assistant
    runtime: docker
    rootDir: projects/p4-deployed-assistant
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: API_KEYS
        sync: false          # set in the dashboard; never committed
      - key: RATE_LIMIT
        value: "10"
      - key: RATE_WINDOW_S
        value: "60"
