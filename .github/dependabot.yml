version: 2
updates:
  - package-ecosystem: pip
    directory: /projects/p4-deployed-assistant
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: docker
    directory: /projects/p4-deployed-assistant
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
